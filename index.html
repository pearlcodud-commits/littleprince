<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson 10 Story Time 2 · 역할놀이 & 내 꿈 직업</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Jua&display=swap" rel="stylesheet">
<style>:root{--ink:#2D2340;--sub:#6B6386;--bg:#FFF8EC;--blue:#1E9BEA;--blueD:#0B6FB0;--yel:#FFD43B;--red:#E5383B;--green:#22B573;--pur:#7B5CFF;--card:#fff;--line:#EFE6D6;--r:22px;--en:'Fredoka','Arial Rounded MT Bold',ui-rounded,system-ui,sans-serif;--ko:'Jua','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);}
body{background-image:radial-gradient(#F6E7CC 1.4px,transparent 1.4px);background-size:22px 22px;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px 6px}
.top .lsn{background:var(--blue);color:#fff;font-family:var(--en);font-weight:700;padding:8px 16px;border-radius:999px;font-size:18px;box-shadow:0 4px 0 var(--blueD)}
.top h1{margin:0;font-family:var(--en);font-size:30px;font-weight:700;letter-spacing:.2px}
.top h1 small{font-family:var(--ko);font-weight:400;font-size:18px;color:var(--sub);margin-left:8px}
.top .who{margin-left:auto;display:flex;gap:6px}
.top .who span{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.1);overflow:hidden;display:block}
.top .who svg{width:100%;height:100%}
.tabs{display:flex;gap:8px;padding:8px 18px 0;position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);overflow-x:auto}
.tabs button{flex:1;min-width:150px;padding:14px 10px 12px;font-size:21px;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 0 #EFE2CA inset;color:var(--sub);transition:.15s}
.tabs button.on{background:var(--yel);color:var(--ink);box-shadow:0 -5px 0 #F0B800 inset;transform:translateY(-3px)}
main{padding:0 18px 40px}
.tab{display:none;background:#fff;border-radius:0 0 var(--r) var(--r);padding:22px;box-shadow:0 10px 30px rgba(80,50,0,.08);animation:fade .25s}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h2{margin:0 0 6px;font-size:28px;font-weight:400}
.hint{color:var(--sub);font-size:17px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{padding:12px 20px;border-radius:16px;font-size:19px;background:#F2EDFF;color:var(--ink);box-shadow:0 4px 0 #D9D0F5;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9D0F5}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blueD)}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #A8232E}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #148556}
.btn.yel{background:var(--yel);box-shadow:0 4px 0 #E0A800}
.btn.big{font-size:24px;padding:16px 28px;border-radius:20px}
.btn.ghost{background:#fff;border:2px solid #E7E0F5;box-shadow:none}
.chip{padding:9px 16px;border-radius:999px;background:#F5F1E8;font-size:18px;border:3px solid transparent;transition:.12s}
.chip.on{background:#FFF3C4;border-color:#F0B800}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:18px;background:#F5F1E8;padding:8px 14px;border-radius:999px;cursor:pointer;user-select:none}
.toggle input{width:22px;height:22px;accent-color:var(--blue)}

/* script lines */
.scene{border:3px solid var(--line);border-radius:20px;margin:14px 0;overflow:hidden}
.scene h3{margin:0;padding:10px 16px;background:#FFF6E0;font-weight:400;font-size:21px;display:flex;align-items:center;gap:10px}
.scene h3 .num{background:#FFA41B;color:#fff;font-family:var(--en);font-weight:700;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.scene h3 .sp{margin-left:auto}
.line{display:flex;align-items:center;gap:14px;padding:10px 16px;border-top:2px dashed #F3ECDD;transition:background .2s}
.line .pf{width:58px;height:58px;flex:none;border-radius:50%;background:#F3F7FF;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.line .pf svg{width:100%;height:100%}
.line .who{flex:none;min-width:96px;padding:6px 10px;border-radius:12px;font-size:17px;text-align:center;background:#F5F1E8}
.line .who.edit{border:2px dashed #C9BFA6;cursor:pointer}
.line .txt{flex:1;min-width:0}
.line .en{font-family:var(--en);font-weight:600;font-size:30px;line-height:1.2}
.line .ko{font-size:17px;color:var(--sub);margin-top:3px;display:none}
.showKo .line .ko{display:block}
.line .say{flex:none;width:48px;height:48px;border-radius:50%;background:#E8F5FF;font-size:22px}
.line.mine .en{color:var(--red)}
.line.mine .who{background:#FFE3E3;color:var(--red)}
.line.mine .tag{display:inline-block}
.tag{display:none;font-family:var(--ko);font-weight:400;font-size:15px;background:var(--red);color:#fff;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.line.now{background:#FFF8D6;box-shadow:inset 6px 0 0 var(--yel)}
.line.mine.now{background:#FFECEC;box-shadow:inset 6px 0 0 var(--red)}
.line.done{opacity:.55}

/* practice */
.pgrid{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.panel{background:#FFFBF2;border:3px solid var(--line);border-radius:20px;padding:16px;position:sticky;top:84px}
.panel h4{margin:6px 0 10px;font-weight:400;font-size:20px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rcard{background:#fff;border:4px solid #EEE6D6;border-radius:18px;padding:8px 6px 10px;text-align:center;font-size:18px;position:relative;transition:.12s}
.rcard .pic{height:118px}
.rcard .pic svg{height:100%;width:100%}
.rcard.on{border-color:var(--red);background:#FFF1F1;transform:scale(1.03)}
.rcard.on::after{content:'🎤 내 역할';position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:14px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ctrl .btn{flex:1}.ctrl #pStart{flex:3;white-space:nowrap}
.seg{display:flex;background:#F5F1E8;border-radius:14px;padding:4px;gap:4px;margin:6px 0}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:16px;background:transparent}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.turn{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(160%);z-index:60;background:#fff;border:5px solid var(--red);border-radius:26px;padding:16px 22px;box-shadow:0 18px 50px rgba(0,0,0,.25);display:flex;align-items:center;gap:18px;transition:transform .3s cubic-bezier(.3,1.4,.6,1);max-width:min(940px,94vw)}
.turn.show{transform:translateX(-50%) translateY(0)}
.turn .pf{width:84px;height:84px;border-radius:50%;overflow:hidden;background:#FFF1F1;flex:none}
.turn .pf svg{width:100%;height:100%}
.turn .lab{font-size:20px;color:var(--red)}
.turn .en{font-family:var(--en);font-weight:700;font-size:38px;color:var(--red);line-height:1.15}
.turn .bar{height:10px;background:#FFE0E0;border-radius:99px;margin-top:8px;overflow:hidden}
.turn .bar i{display:block;height:100%;width:0;background:var(--red);border-radius:99px}
.turn .btn{flex:none}

/* stage */
.castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:12px 0 18px}
.cast{background:#FFFBF2;border:3px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.cast .pic{height:150px}.cast .pic svg{height:100%;width:100%}
.cast input{width:100%;font-size:20px;padding:10px;border-radius:12px;border:3px solid #EEE6D6;text-align:center;margin-top:6px}
.stageView{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
.stageView.on{display:flex}
.stageView .bgw{position:absolute;inset:0}
.stageView .bgw svg{width:100%;height:100%;display:block}
.stageView .curtL,.stageView .curtR{position:absolute;top:0;bottom:0;width:9%;background:repeating-linear-gradient(90deg,#B5172E 0 22px,#8A0F20 22px 30px);z-index:3;box-shadow:0 0 30px rgba(0,0,0,.5)}
.stageView .curtL{left:0;border-radius:0 0 60px 0}.stageView .curtR{right:0;border-radius:0 0 0 60px}
.stageView .topbar{position:relative;z-index:5;display:flex;gap:10px;align-items:center;padding:12px 11%;}
.stageView .topbar .ttl{background:rgba(255,255,255,.92);padding:8px 18px;border-radius:999px;font-size:20px}
.stageView .topbar .sp{flex:1}
.actors{position:relative;z-index:4;flex:1;display:flex;justify-content:center;align-items:flex-end;gap:2vw;padding:0 11%;min-height:0}
.actor{height:100%;max-height:52vh;display:flex;flex-direction:column;align-items:center;transition:transform .35s cubic-bezier(.3,1.5,.6,1),opacity .3s,filter .3s;opacity:.6;filter:saturate(.7);transform-origin:bottom center}
.actor svg{height:calc(100% - 44px);width:auto;aspect-ratio:4/5}
.actor .nm{background:#fff;border-radius:999px;padding:5px 16px;font-size:19px;white-space:nowrap;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.actor .nm b{font-weight:400;color:var(--sub);font-size:15px;margin-left:4px}
.actor.speak{opacity:1;filter:none;transform:scale(1.12);animation:bob .9s ease-in-out infinite alternate}
.actor.speak .nm{background:var(--yel)}
@keyframes bob{to{transform:scale(1.12) translateY(-8px)}}
.subt{position:relative;z-index:5;margin:10px 11% 16px;background:rgba(255,255,255,.96);border-radius:26px;padding:16px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);min-height:120px}
.subt .who{flex:none;font-size:22px;background:var(--yel);padding:8px 16px;border-radius:14px}
.subt .txt{flex:1;cursor:pointer}
.subt .en{font-family:var(--en);font-weight:700;font-size:clamp(30px,4.4vw,60px);line-height:1.1}
.subt .ko{font-size:20px;color:var(--sub);margin-top:4px}
.subt .en.hid{color:transparent;background:repeating-linear-gradient(45deg,#E7E0F5 0 12px,#F2EDFF 12px 24px);border-radius:12px}
.subt .nav{display:flex;gap:8px;flex:none}
.subt .nav .btn{font-size:26px;padding:14px 18px}
.stProg{position:relative;z-index:5;margin:0 11% 10px;display:flex;gap:6px}
.stProg i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.4)}
.stProg i.on{background:var(--yel)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.bravo{position:absolute;z-index:6;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);background:#fff;border-radius:30px;padding:26px 40px;text-align:center;font-size:40px;box-shadow:0 20px 60px rgba(0,0,0,.4);transition:transform .4s cubic-bezier(.3,1.6,.6,1)}
.bravo.on{transform:translate(-50%,-50%) scale(1)}
.bravo small{display:block;font-size:20px;color:var(--sub);margin:6px 0 14px}

/* next story */
.bigq{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#1E9BEA,#4CB8FF);color:#fff;border-radius:20px;padding:14px 20px;margin-bottom:16px}
.bigq .bi{background:var(--yel);color:#1B3A8C;font-family:var(--en);font-weight:700;padding:6px 14px;border-radius:12px;font-size:20px;white-space:nowrap}
.bigq .q{font-size:26px}
.ngrid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:start}
.step{background:#FFFBF2;border:3px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px}
.step h4{margin:0 0 10px;font-weight:400;font-size:21px;display:flex;align-items:center;gap:8px}
.step h4 .n{background:var(--pur);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--en);font-size:17px}
.jobgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.jb{background:#fff;border:3px solid #EEE6D6;border-radius:16px;padding:4px 4px 6px;text-align:center;transition:.12s}
.jb .pic{aspect-ratio:4/5;border-radius:12px;overflow:hidden}
.jb .pic svg{width:100%;height:100%;display:block}
.jb .e{font-family:var(--en);font-weight:600;font-size:15px;line-height:1.1;margin-top:4px}
.jb .k{font-size:13px;color:var(--sub)}
.jb.on{border-color:var(--blue);background:#EAF6FF;transform:scale(1.04);box-shadow:0 6px 16px rgba(30,155,234,.3)}
.dl{display:flex;align-items:flex-start;gap:10px;margin:8px 0}
.dl .who{flex:none;width:92px;text-align:center;font-size:16px;padding:8px 4px;border-radius:12px;background:#F5F1E8}
.dl .body{flex:1}
.dl input{width:100%;font-family:var(--en);font-weight:600;font-size:22px;padding:10px 12px;border:3px solid #EEE6D6;border-radius:14px;background:#fff}
.dl .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dl .opts .chip{font-size:15px;padding:6px 12px;font-family:var(--en);font-weight:500}
.preview{border-radius:22px;overflow:hidden;position:relative;aspect-ratio:16/10;background:#BDE7FF;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.preview .bgw,.preview .bgw svg{position:absolute;inset:0;width:100%;height:100%}
.preview .duo{position:absolute;left:0;right:0;bottom:2%;height:78%;display:flex;justify-content:center;gap:6%}
.preview .duo svg{height:100%;width:auto;aspect-ratio:4/5}
.preview .place{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);padding:6px 14px;border-radius:999px;font-size:18px}
.mini-scenes{margin-top:14px}
.ms{display:flex;align-items:center;gap:10px;background:#F7F3EA;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:18px}
.ms .x{margin-left:auto;background:#fff;border-radius:10px;padding:6px 10px;font-size:15px}

/* job maker */
.jgrid{display:grid;grid-template-columns:minmax(320px,440px) 1fr;gap:22px;align-items:start}
.stagebox{position:sticky;top:84px}
.avbox{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.18);aspect-ratio:4/5;background:#fff}
.avbox>svg{width:100%;height:100%;display:block}
.bubble{position:absolute;top:4%;right:4%;max-width:72%;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:10px 16px;font-family:var(--en);font-weight:700;font-size:26px;box-shadow:0 6px 0 rgba(0,0,0,.15);transform-origin:bottom left;transition:transform .3s cubic-bezier(.3,1.6,.6,1)}
.bubble::after{content:'';position:absolute;left:18px;bottom:-18px;border:10px solid transparent;border-top:14px solid var(--ink)}
.bubble.hide{transform:scale(0)}
.bubble.q{left:4%;right:auto;top:auto;bottom:4%;background:#FFF6C2;font-size:20px}
.bubble.q::after{display:none}
.subtabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{padding:10px 18px;border-radius:14px;font-size:19px;background:#F5F1E8}
.subtabs button.on{background:var(--pur);color:#fff}
.pane{display:none}.pane.on{display:block}
.opt-row{margin:10px 0 16px}
.opt-row h5{margin:0 0 8px;font-weight:400;font-size:19px}
.sw{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px #EEE6D6}
.sw.on{box-shadow:0 0 0 4px var(--blue)}
.mixgrid{display:flex;flex-wrap:wrap;gap:8px}
.mixgrid .chip{font-size:16px}
.write{margin-top:18px;background:linear-gradient(135deg,#FFF8D6,#FFEFD6);border:3px solid #F6D98A;border-radius:22px;padding:18px}
.write .sent{display:flex;align-items:center;gap:10px;font-family:var(--en);font-weight:700;font-size:40px;flex-wrap:wrap}
.write .sent input{flex:1;min-width:220px;font-family:var(--en);font-weight:700;font-size:38px;padding:6px 14px;border:none;border-bottom:5px dashed #E0A800;background:transparent;color:var(--blueD);outline:none}
.wb{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.wb .chip{font-family:var(--en);font-weight:500;font-size:16px;background:#fff}
.fb{min-height:30px;font-size:20px;margin:8px 0}
.fb.ok{color:var(--green)}.fb.no{color:#D9480F}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.gc{background:#fff;border:3px solid var(--line);border-radius:18px;overflow:hidden;text-align:center;position:relative}
.gc .pic{aspect-ratio:4/5}.gc .pic svg{width:100%;height:100%;display:block}
.gc .cap{padding:6px;font-size:16px}.gc .cap b{display:block;font-family:var(--en);font-size:16px}
.gc .del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);border-radius:50%;width:30px;height:30px;font-size:14px}
.modal{position:fixed;inset:0;z-index:150;background:rgba(20,10,40,.6);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:28px;padding:20px;max-width:960px;width:100%;max-height:94vh;overflow:auto;position:relative}
.modal .close{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;background:#F5F1E8;font-size:22px;z-index:3}
.show-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.show-grid .avbox{max-height:80vh}
.show-grid .say{font-family:var(--en);font-weight:700;font-size:54px;line-height:1.1}
.show-grid .nm{font-size:30px;margin-bottom:10px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-150%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:19px;z-index:300;transition:transform .3s}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:1000px){.pgrid,.ngrid,.jgrid{grid-template-columns:1fr}.panel,.stagebox{position:static}.top h1{font-size:22px}.tabs button{font-size:17px;min-width:120px}.line .en{font-size:24px}.show-grid{grid-template-columns:1fr}}
.turn{visibility:hidden}.turn.show{visibility:visible}
.toast{visibility:hidden}.toast.on{visibility:visible}
</style></head><body>
<header class="top"><div class="lsn">Lesson 10</div><h1>What do you do? <small>Story Time 2 · 어린 왕자의 여행</small></h1><div class="who" id="heads"></div></header>
<nav class="tabs"><button data-t="script" class="on">📜 대본</button><button data-t="practice">🎧 역할 연습</button><button data-t="stage">🎭 역할놀이 무대</button><button data-t="next">✨ 이어질 내용 만들기</button><button data-t="job">👔 내 꿈 직업 꾸미기</button></nav>
<main><section id="t-script" class="tab on"></section><section id="t-practice" class="tab"></section><section id="t-stage" class="tab"></section><section id="t-next" class="tab"></section><section id="t-job" class="tab"></section></main>
<div class="turn" id="turn"></div>
<div class="stageView" id="stageView"></div>
<div class="modal" id="modal"><div class="box"></div></div>
<div class="confetti" id="confetti"></div><div class="toast" id="toast"></div>
<script>/* ================== ART ENGINE (SVG) ================== */
const OUT='rgba(70,45,45,.38)';
let UID=0; const nu=()=>'u'+(++UID)+'_';
const SKINS=[['#FFE3CC','#F0C2A0'],['#F9D2B0','#E5AC84'],['#E9B58C','#CC8F64'],['#C68A5E','#A56C44'],['#8E5B3A','#6B4127']];
const HAIRC=['#2B2220','#5B3420','#9A6234','#E8B84C','#C24E2C','#F08DB8','#4F78E0','#8E5BD8'];
const HAIRSTYLES=[{id:'short',ko:'짧은 머리'},{id:'spiky',ko:'삐죽 머리'},{id:'curly',ko:'곱슬 머리'},{id:'bob',ko:'단발'},{id:'long',ko:'긴 머리'},{id:'pigtails',ko:'양갈래'},{id:'bun',ko:'똥머리'}];
const FACES=[{id:'smile',ko:'😊 미소'},{id:'grin',ko:'😁 활짝'},{id:'wow',ko:'😮 놀람'},{id:'wink',ko:'😉 윙크'}];
const TORSO='M140,270 C152,257 176,251 200,251 C224,251 248,257 260,270 L270,392 C238,404 162,404 130,392 Z';

function shade(hex,p){let n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p):v+(255-v)*p)));return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function rng(seed){return ()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
function starPts(cx,cy,R,r,n=5){let p=[];for(let i=0;i<n*2;i++){const a=Math.PI/n*i-Math.PI/2;const rad=i%2?r:R;p.push((cx+Math.cos(a)*rad).toFixed(1)+','+(cy+Math.sin(a)*rad).toFixed(1));}return p.join(' ');}
const star=(cx,cy,R,fill,stroke='')=>`<polygon points="${starPts(cx,cy,R,R*.45)}" fill="${fill}" ${stroke?`stroke="${stroke}" stroke-width="2" stroke-linejoin="round"`:''}/>`;
function cloud(x,y,s,op=1){return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><circle cx="0" cy="0" r="22" fill="#fff"/><circle cx="24" cy="-12" r="27" fill="#fff"/><circle cx="52" cy="0" r="20" fill="#fff"/><rect x="0" y="-2" width="52" height="22" fill="#fff"/></g>`;}
function sparkle(x,y,s,c='#fff'){return `<path transform="translate(${x},${y}) scale(${s})" d="M0,-12 Q2,-2 12,0 Q2,2 0,12 Q-2,2 -12,0 Q-2,-2 0,-12Z" fill="${c}"/>`;}
function flame(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0,0 C-26,-8 -30,-42 -8,-74 C-6,-52 6,-50 4,-86 C28,-62 34,-30 24,-8 C18,2 8,3 0,0Z" fill="#FF6B1A"/><path d="M2,-2 C-12,-6 -14,-26 -2,-44 C0,-32 8,-30 8,-50 C20,-34 20,-14 14,-4 C10,0 6,0 2,-2Z" fill="#FFD23F"/></g>`;}
function flower(x,y,c,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0,0 L0,40" stroke="#3E8E41" stroke-width="5"/><path d="M0,26 C10,16 22,18 24,22 C16,30 8,30 0,28Z" fill="#4CAF50"/>${[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="-10" rx="8" ry="12" fill="${c}" transform="rotate(${a})"/>`).join('')}<circle r="7" fill="#FFD23F"/></g>`;}
function tulip(x,y,c,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M0,0 L0,46" stroke="#3E8E41" stroke-width="5"/><path d="M0,30 C-14,18 -22,24 -22,28 C-14,34 -6,34 0,34Z" fill="#4CAF50"/><path d="M-14,-18 L-14,0 Q0,12 14,0 L14,-18 L7,-8 L0,-20 L-7,-8 Z" fill="${c}" stroke="${shade(c,-.25)}" stroke-width="2"/></g>`;}

    case 'bob':s=`<path d="M108,218 C98,120 140,72 200,72 C260,72 302,120 292,218 C288,190 286,166 282,140 Q241,128 200,140 Q159,128 118,140 C114,166 112,190 108,218 Z" ${o}/>`+hl;break;

function faceSVG(f,c){
  const eye=x=>`<ellipse cx="${x}" cy="176" rx="11" ry="${f==='wow'?16:14}" fill="#2A1B18"/><circle cx="${x+4}" cy="169" r="4.5" fill="#fff"/><circle cx="${x-3}" cy="182" r="2.2" fill="#fff" opacity=".85"/>`;
  const bc=shade(c.hair,-.25), by=f==='wow'?-6:0;
  let s=eye(168);
  s+=f==='wink'?`<path d="M220,178 Q232,166 244,178" stroke="#2A1B18" stroke-width="5" fill="none" stroke-linecap="round"/>`:eye(232);
  s+=`<path d="M152,${150+by} Q166,${142+by} 180,${148+by}" stroke="${bc}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M220,${148+by} Q234,${142+by} 248,${150+by}" stroke="${bc}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  s+=`<ellipse cx="148" cy="202" rx="14" ry="8" fill="#FF6B6B" opacity=".33"/><ellipse cx="252" cy="202" rx="14" ry="8" fill="#FF6B6B" opacity=".33"/>`;
  s+=`<path d="M195,193 Q200,198 205,193" stroke="${c.skinS}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(f==='grin')s+=`<path d="M178,208 Q200,238 222,208 Z" fill="#8E2B35"/><path d="M181,209 Q200,214 219,209 L218,213 Q200,219 182,213 Z" fill="#fff"/><path d="M190,224 Q200,232 210,224 Q200,218 190,224Z" fill="#F07C82"/>`;
  else if(f==='wow')s+=`<ellipse cx="200" cy="218" rx="9" ry="11" fill="#8E2B35"/>`;
  else s+=`<path d="M182,210 Q200,226 218,210" stroke="#8E2B35" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
  return s;
}

const JM=Object.fromEntries(JOBS.map(j=>[j.id,j]));

const art=w=>/^[aeiou]/i.test(w)?'an':'a';

function resolveOutfit(o,u){
  const r={...o};
  ['shirt','sleeve','pants'].forEach(k=>{if(typeof o[k]==='string'&&o[k][0]==='@')r[k]=`url(#${u}${o[k].slice(1)})`;});
  return r;
}
function avatarSVG(cfg,opt={}){
  const u=nu(); const sk=SKINS[cfg.skin||0]||SKINS[0];
  const c={u,skin:sk[0],skinS:sk[1],hair:cfg.hairColor||HAIRC[0]};
  const oJ=JM[cfg.outfit]||JM.casual, hJ=JM[cfg.hat], pJ=JM[cfg.prop], bJ=JM[cfg.bg];
  const o=resolveOutfit(oJ.outfit,u);
  let defs=`<linearGradient id="${u}sh" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".16"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient>`;
  new Set([oJ,hJ,pJ,bJ].filter(Boolean)).forEach(j=>{if(j.defs)defs+=j.defs(u);});
  const st=cfg.hairStyle||'short';
  let s=`<svg viewBox="${opt.viewBox||'0 0 400 500'}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="${opt.par||'xMidYMid meet'}" class="${opt.cls||''}"><defs>${defs}</defs>`;
  if(opt.bg!==false&&bJ&&bJ.bg)s+=bJ.bg(c);
  s+=groundShadow;
  s+=hairBack(st,c.hair);
  s+=`<rect x="186" y="226" width="28" height="36" fill="${c.skin}" stroke="${OUT}" stroke-width="3"/><rect x="186" y="232" width="28" height="12" fill="${c.skinS}" opacity=".6"/>`;
  s+=legsSVG(o,c);
  s+=`<path d="${TORSO}" fill="${o.shirt}" stroke="${OUT}" stroke-width="3" stroke-linejoin="round"/>`;
  if(o.details)s+=o.details(c);
  s+=`<path d="${TORSO}" fill="url(#${u}sh)"/>`;
  s+=armsSVG(o,c);
  if(pJ&&pJ.prop)s+=pJ.prop(c);
  s+=handsSVG(c);
  s+=headSVG(cfg,c);
  s+=hairFront(st,c.hair);
  if(hJ&&hJ.hat)s+=hJ.hat(c);
  return s+'</svg>';
}

function showLine(i,quiet){
  const sc=sceneById(ST.sc);
  if(i>=sc.lines.length){try{speechSynthesis.cancel()}catch(e){};$('#bravo').classList.add('on');clap();confetti(120);return;}
  ST.i=i;const r=spk(sc,i),cast=S.cast[sc.id]||{};
  $$('.actor').forEach(a=>a.classList.toggle('speak',a.dataset.act===r));
  $$('.stProg i').forEach((e,k)=>e.classList.toggle('on',k<=i));
  $('#svWho').textContent=(cast[r]?cast[r]+' · ':'')+roles()[r].name;
  const en=$('#svEn');en.textContent=sc.lines[i].en;en.classList.toggle('hid',ST.hide);
  $('#svKoT').textContent=ST.ko?(sc.lines[i].ko||''):'';
  $('#svKo').style.opacity=ST.ko?1:.6;$('#svHide').style.opacity=ST.hide?1:.6;
  try{speechSynthesis.cancel()}catch(e){}

}
function closeStage(){try{speechSynthesis.cancel()}catch(e){};$('#stageView').classList.remove('on');try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}}
document.addEventListener('keydown',e=>{if(!$('#stageView').classList.contains('on'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();showLine(ST.i+1);}if(e.key==='ArrowLeft')showLine(Math.max(0,ST.i-1));if(e.key==='Escape')closeStage();});

function checkSentence(raw){
  let t=raw.trim().replace(/[.!]+$/,'').toLowerCase().replace(/\s+/g,' ');
  if(!t)return {ok:false,msg:'✍️ 빈칸에 내 꿈 직업을 영어로 써 보세요! 예) a cook'};
  const m=t.match(/^(a|an) ([a-z][a-z ]*)$/);
  if(!m){if(/^[a-z ]+$/.test(t))return {ok:false,msg:`💡 직업 앞에 a 또는 an을 붙여요! → I’m ${art(t)} ${t}.`};return {ok:false,msg:'💡 영어 알파벳으로 써 보세요.'};}
  const w=m[2],good=art(w);
  if(m[1]!==good)return {ok:false,msg:`💡 '${w}'는 ${good==='an'?'a, e, i, o, u(모음)로 시작해서 an':'자음으로 시작해서 a'}을 써요! → I’m ${good} ${w}.`};
  const k=PICK_JOBS.find(j=>j.en===w);
  return {ok:true,msg:k?`🎉 완벽해요! “I’m ${good} ${w}.” = 나는 ${k.ko}${josa(k.ko)}.`:`🎉 멋진 문장이에요! “I’m ${good} ${w}.”`};
}

  drawJobThumbs();drawMe();
  $$('[data-pane]').forEach(b=>b.onclick=()=>{J.pane=b.dataset.pane;$$('[data-pane]').forEach(x=>x.classList.toggle('on',x===b));$$('.pane').forEach(p=>p.classList.toggle('on',p.dataset.p===J.pane));});
  $$('[data-look]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.look.split('|');J.look[k]=k==='skin'?+v:v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawMe();drawJobThumbs();saveMe();});
  $$('[data-mix]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.mix.split('|');J[k]=v;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawMe();saveMe();});
  const si=$('#jSent');si.oninput=()=>{J.sent=si.value;drawMe();$('#jFb').textContent='';saveMe();};
  si.onkeydown=e=>{if(e.key==='Enter')doCheck();};
  $('#jName').oninput=e=>{J.name=e.target.value;saveMe();};
  $$('[data-wb]').forEach(b=>b.onclick=()=>{J.sent=b.dataset.wb;si.value=J.sent;drawMe();doCheck();saveMe();});
  $('#jCheck').onclick=doCheck;
  $('#jSay').onclick=()=>{const t=bubbleText();if(!t)return toast('✍️ 먼저 문장을 써 보세요!');speak(t,{pitch:1.3,rate:.9});};
  $('#jAsk').onclick=interview;
  $('#jRand').onclick=()=>{const j=PICK_JOBS[Math.floor(Math.random()*PICK_JOBS.length)];J.look=randLook();Object.assign(J,{hat:j.id,outfit:j.id,prop:j.id,bg:j.id});renderJob();saveMe();};
  $('#jBig').onclick=()=>showCard({cfg:jCfg(),sent:J.sent.trim().replace(/[.!]+$/,''),name:J.name});
  $('#jPost').onclick=()=>{const r=checkSentence(J.sent);if(!r.ok){doCheck();return toast('문장을 먼저 고쳐 볼까요? 🙂');}S.gallery.push({id:'g'+Date.now(),name:J.name.trim(),cfg:jCfg(),sent:J.sent.trim().replace(/[.!]+$/,'').toLowerCase()});save();renderJob();confetti(80);ding();toast('⭐ 전시관에 걸었어요!');setTimeout(()=>$('.gal').scrollIntoView({behavior:'smooth',block:'center'}),200);};
  $$('[data-g]').forEach(c=>c.onclick=e=>{if(e.target.closest('.del'))return;const g=S.gallery.find(x=>x.id===c.dataset.g);if(g)showCard(g);});
  $$('[data-gdel]').forEach(b=>b.onclick=()=>{if(b.dataset.sure){S.gallery=S.gallery.filter(g=>g.id!==b.dataset.gdel);save();renderJob();}else{b.dataset.sure=1;b.textContent='지움?';b.style.width='auto';b.style.borderRadius='10px';b.style.padding='0 8px';b.style.background='#E5383B';b.style.color='#fff';}});
  const gs=$('#gShow');if(gs)gs.onclick=()=>showCard(S.gallery[0],0);
}
function drawJobThumbs(){
  const g=$('#jJobs');if(!g)return;
  g.innerHTML=PICK_JOBS.map(x=>`<button class="jb ${x.id===J.outfit&&x.id===J.hat?'on':''}" data-jj="${x.id}"><div class="pic">${avatarSVG({...J.look,hat:x.id,outfit:x.id,prop:x.id,bg:x.id})}</div><div class="e">${x.en}</div><div class="k">${x.ko}</div></button>`).join('');
  $$('[data-jj]').forEach(b=>b.onclick=()=>{const id=b.dataset.jj;Object.assign(J,{hat:JM[id].hat?id:'none',outfit:id,prop:id,bg:id});$$('[data-jj]').forEach(x=>x.classList.toggle('on',x===b));drawMe();saveMe();});
}
function doCheck(){const r=checkSentence(J.sent);const f=$('#jFb');f.textContent=r.msg;f.className='fb '+(r.ok?'ok':'no');if(r.ok){ding();const b=$('#bub');b.style.transform='scale(1.15)';setTimeout(()=>b.style.transform='',250);}}
async function interview(){
  const t=bubbleText();if(!t)return toast('✍️ 먼저 I’m ___. 문장을 써 보세요!');
  stopAll();const q=$('#qbub'),b=$('#bub');b.classList.add('hide');q.classList.remove('hide');
  await speak('What do you do?',{pitch:1,rate:.9});await sleep(500);
  q.classList.add('hide');b.classList.remove('hide');await speak(t,{pitch:1.3,rate:.9});
}
function showCard(g,idx){
  const m=$('#modal');const sent=g.sent?`I’m ${g.sent}.`:'';
  const list=idx!=null;
  m.querySelector('.box').innerHTML=`<button class="close" id="mX">✖</button><div class="show-grid"><div class="avbox">${avatarSVG(g.cfg)}</div><div><div class="nm">${esc(g.name||'')}</div><div style="font-size:22px;color:var(--sub);font-family:var(--en)">What do you do?</div><div class="say">${esc(sent)}</div><div class="row" style="margin-top:20px"><button class="btn green big" id="mSay">🔊 듣기</button>${list?`<button class="btn ghost big" id="mPrev">◀</button><button class="btn blue big" id="mNext">다음 ▶</button><span style="font-size:18px;color:var(--sub)">${idx+1} / ${S.gallery.length}</span>`:''}</div></div></div>`;
  m.classList.add('on');
  $('#mX').onclick=()=>m.classList.remove('on');
  $('#mSay').onclick=async()=>{await speak('What do you do?',{pitch:1,rate:.9});await sleep(300);if(sent)speak(sent,{pitch:1.3,rate:.9});};
  if(list){$('#mPrev').onclick=()=>showCard(S.gallery[(idx-1+S.gallery.length)%S.gallery.length],(idx-1+S.gallery.length)%S.gallery.length);$('#mNext').onclick=()=>{const n=(idx+1)%S.gallery.length;showCard(S.gallery[n],n);};}
}

/* ================== INIT ================== */
function renderAll(){renderScript();renderPractice();renderStageSetup();renderNext();}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]');if(s){const [sid,i]=s.dataset.say.split(':');const sc=sceneById(sid);stopAll();speak(sc.lines[+i].en,spk(sc,+i));return;}
  const w=e.target.closest('[data-swap]');if(w){swapSpeaker(w.dataset.swap);return;}
  const ps=e.target.closest('[data-playscene]');if(ps){const sc=sceneById(ps.dataset.playscene);playSeq('#scList',sc.lines.map((_,i)=>[sc,i]));return;}
  if(e.target.closest('[data-stop]'))stopAll();
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on');});
$$('.tabs button').forEach(b=>b.onclick=()=>{stopAll();$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$$('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.t));if(b.dataset.t==='job'&&!$('#avSvg'))renderJob();window.scrollTo({top:0,behavior:'smooth'});});
$('#heads').innerHTML=['prince','pilot','fox','rose'].map(r=>`<span>${charSVG(r,{viewBox:HEAD})}</span>`).join('');
renderAll();renderJob();
</script>
</body></html>
